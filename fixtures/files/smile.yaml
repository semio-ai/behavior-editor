root: root
nodes:
- id: root
  function: running
- id: amount
  function: clamp
  bind:
    in:
      key: face/smile
    max:
      value:
        f32: 1.0
    min:
      value:
        f32: 0.0
- id: corner
  function: remap
  bind:
    in:
      port:
        node: amount
        port: _ret
    in_max:
      value:
        f32: 1.0
    in_min:
      value:
        f32: 0.0
    out_max:
      value:
        f32: 1.0
    out_min:
      value:
        f32: -0.2
- id: mouth
  function: damp
  bind:
    _ret:
      key: rig/mouth_corner
    dt:
      key: arora/dt
    in:
      port:
        node: corner
        port: _ret
    param.half_life:
      value:
        f32: 0.12
    state:
      value: unit
- id: cheeks
  function: multiply
  bind:
    _ret:
      key: rig/cheek_raise
    operand_0:
      port:
        node: amount
        port: _ret
    operand_1:
      value:
        f32: 0.6
