[package]
name = "dataflow-device"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/semio-ai/behavior-editor"
description = "An Arora device in the browser carrying @arora/dataflow: arora-web's device, which the behavior editor's integration test and demo run behaviors on."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The device: the runtime, without its native hosts (no default features), so
# it builds for the browser. On a native target it runs without a guest
# module, which this device loads none of: its native tests run the same
# device. 17.1: its interpreter answers READ and keeps the behavior's
# revision.
arora = { version = "17.1", default-features = false }
# `@arora/dataflow`, the functions a behavior's nodes call. Without `urdf_ik`:
# the URDF nodes are `@arora/kinematics`', which the device does not carry.
arora-dataflow-nodes = { version = "2", default-features = false }
# The host store the device's keys sit in, under its namespace.
arora-simple-data-store = "3.2"
# Call, CallBridge, Value, Key and KeyMeta.
arora-types = "3.10"
serde_json = "1"
uuid = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser device the runtime is wrapped in: its step, and its caller.
arora-web = "14"
futures = "0.3"
serde = "1"
wasm-bindgen = "0.2"
# Browser RNG backend for the uuid v4 the arora crates enable: the `wasm_js`
# feature plus the getrandom_backend cfg in .cargo/config.toml select WebCrypto
# on wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }
