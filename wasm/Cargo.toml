[package]
name = "behavior-text"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "The behavior text language of arora-behavior-tree, for @semio/behavior-editor: parse, format and resolve a behavior file in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The language: its parser, formatter, resolver and natives (`text`, 9.6).
arora-behavior-tree = "9.6"
# The shared Graph, the function index, and the interpreter's call conventions.
arora-behavior = "9.6"
# Call and CallResult, the JSON a device's `call` takes and answers.
arora-types = "3.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
wasm-bindgen = "0.2"
# Browser RNG backend for the uuid v4 the arora crates enable: the `wasm_js`
# feature plus the getrandom_backend cfg in .cargo/config.toml select WebCrypto
# on wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
